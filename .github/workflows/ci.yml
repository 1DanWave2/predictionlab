name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-labs.txt
      - run: cp .env.example .env
      - run: python -m compileall -q app scripts labs tests
      - run: pytest -q
      - name: Smoke tick on mock data
        run: USE_MOCK_DATA=true python -m app.main --once
