name: pages

on:
  push:
    branches: [main]
    paths: ["README.md", "CONTRIBUTING.md", "docs/links.md", "labs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Stage docs (README.md serves as each folder's index)
        run: |
          mkdir -p site_src/labs
          cp README.md CONTRIBUTING.md docs/links.md site_src/
          rsync -a --include='*/' --include='*.md' --include='*.png' --exclude='*' labs/ site_src/labs/
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
